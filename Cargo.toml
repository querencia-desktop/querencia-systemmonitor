[package]
name = "querencia-systemmonitor"
version = "0.1.3"
edition = "2024"
rust-version = "1.92"
description = "Querencia Systemmonitor: Prozesse, Ressourcen und Dateisysteme für Querencia Desktop"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Dieselben Bindings wie die übrigen Querencia-Programme (gtk-rs 0.11).
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# Nur für kill(2), setpriority(2), statvfs(3) und sysconf(3); siehe src/sys.rs.
libc = "0.2"
# Übersetzungen über GNU gettext (po/, .mo unter share/locale). Feature
# gettext-system: das gettext der glibc statt eines mitgebauten libintl.
gettext-rs = { version = "0.8", features = ["gettext-system"] }

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
# Nur src/sys.rs darf unsafe (erlaubt dort ausdrücklich), alles andere nicht.
unsafe_code = "deny"
unused_must_use = "deny"
